# Deploy the built site to GitHub Pages.
#
# `base` in vite.config.ts must match the repository name, because Pages serves
# a project site from /<repo>/ and anything else 404s every asset. It defaults
# to '/thegreatescape/'; BASE_PATH overrides it, and this workflow passes the
# repository's actual name so a rename cannot silently break the deploy.

name: Deploy to Pages

# MANUAL ONLY -- deliberately not on push. Two reasons, and the second is the
# one that matters.
#
# 1. Pages is not enabled on this repository, so an automatic run just paints
#    every push red.
#
# 2. Publishing is not a neutral act here. data/ holds graphics extracted from
#    the original game, and the README says so: "derived from the copyrighted
#    work ... not original to this repository". The repo is private precisely
#    because of that -- CLAUDE.md: "making it public would publish extracted
#    copyrighted data". A Pages site built from a private repository is still
#    served publicly unless access control is configured, so switching Pages on
#    would put that data on a public URL.
#
# So this is a decision, not a build step. Run it from the Actions tab once
# you have settled the question and enabled Pages.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; queued rather than cancelled, so a push mid-deploy does
# not leave the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
