# Continuous integration: typecheck, tests, build.
#
# What is deliberately ABSENT is the extraction gate. `npm run extract:check`
# and `npm run extract:goldens` both read The-Great-Escape/ -- the SkoolKit
# disassembly and, next to it, build/TheGreatEscape.pristine.z80, which is the
# original 48K game image. BUILD_PROMPT.md §2 and §10 are explicit that the
# tape image must not be shipped, so that directory is gitignored and simply is
# not here for a runner to read.
#
# They are not optional, they are LOCAL: run them before every commit, as
# CLAUDE.md's verification section says. CI can only check the half of the
# work that lives in this repository.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc first: a type error makes every test failure below it noise.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npx vite build
